spring.application.name=llm-handoff-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/llm_handoff?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:llm_handoff}
spring.datasource.password=${DB_PASSWORD:llm_handoff}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.flyway.baseline-on-migrate=true

# JWT settings
app.jwt.secret=${JWT_SECRET:LLMHandoffSecretKeyMustBeVeryLongForHS512AlgorithmSecurity20261008SecureKeyForAuth}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000}

# OAuth2 Provider Registrations
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# Actuator and Monitoring Configuration
# Actuator runs on a separate management server bound to loopback so it is never reachable from outside the container.
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
