spring.application.name=llm-handoff-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/llm_handoff?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:llm_handoff}
spring.datasource.password=${DB_PASSWORD:llm_handoff}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
