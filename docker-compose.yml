services:
  mysql:
    image: mysql:8.0
    container_name: llm-handoff-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: llm_handoff
      MYSQL_USER: llm_handoff
      MYSQL_PASSWORD: llm_handoff
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "llm_handoff", "-pllM_handoff"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
